<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أركان الخليج - بوابة العامل</title>
    
    <!-- تحميل Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- تحميل مكتبة الأيقونات Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- تحميل الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-ar: 'Tajawal', sans-serif;
            --font-en: 'Inter', sans-serif;
        }
        body { 
            font-family: var(--font-ar); 
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc; /* slate-50 */
        }
        .ltr body { font-family: var(--font-en); }
        
        /* تأثيرات حركية */
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .slide-down { animation: slideDown 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideDown {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(100%); }
        }

        /* تحسينات التصميم */
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- شريط اللغة -->
    <div class="bg-slate-900 text-slate-300 py-2 px-4 flex justify-end z-20 relative">
        <button id="btn-lang" class="flex items-center gap-2 text-xs font-semibold hover:text-white transition-colors">
            <i class="ph ph-globe text-lg"></i>
            <span id="txt-lang">English</span>
        </button>
    </div>

    <!-- الترويسة -->
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10 glass-effect">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center gap-3">
            <div class="w-12 h-12 bg-blue-900 rounded-xl flex items-center justify-center shadow-inner relative overflow-hidden flex-shrink-0">
                <i class="ph-fill ph-hexagon text-3xl text-blue-400 relative z-10"></i>
                <div class="absolute inset-0 bg-gradient-to-tr from-blue-900 to-blue-600 opacity-50"></div>
            </div>
            <form onsubmit="handleFormSubmit(event, 'leave')" class="space-y-4">
                <div>
                    <label id="txt-mod-leave-date" class="block text-sm font-bold text-slate-700 mb-1">تاريخ البدء</label>
                    <input type="date" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50 text-slate-800 font-medium">
                </div>
                <div>
                    <label id="txt-mod-leave-type" class="block text-sm font-bold text-slate-700 mb-1">نوع الإجازة</label>
                    <select required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-600 outline-none bg-slate-50 text-slate-800 font-medium">
                        <option id="opt-leave-1" value="1">إجازة سنوية (مستحقة)</option>
                        <option id="opt-leave-2" value="2">إجازة مرضية</option>
                        <option id="opt-leave-3" value="3">إجازة طارئة (بدون راتب)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-md mt-4 active:scale-95 transition-transform">
                    <span id="txt-mod-leave-btn">إرسال الطلب للإدارة</span>
                </button>
            </form>
        </div>
    </div>

    <!-- نافذة طلب سلفة -->
    <div id="modal-loan" class="fixed bottom-0 left-0 right-0 z-50 hidden translate-y-full transition-transform duration-300 w-full max-w-md mx-auto">
        <div class="bg-white rounded-t-3xl shadow-2xl p-6 pb-10 border-t border-slate-100">
            <div class="flex justify-between items-center mb-6">
                <h3 id="txt-mod-loan-title" class="font-bold text-lg text-slate-800 flex items-center gap-2">
                    <i class="ph-fill ph-money text-emerald-600"></i> طلب سلفة مالية
                </h3>
                <button onclick="closeModals()" class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200"><i class="ph-bold ph-x"></i></button>
            </div>
            <form onsubmit="handleFormSubmit(event, 'loan')" class="space-y-4">
                <div>
                    <label id="txt-mod-loan-amt" class="block text-sm font-bold text-slate-700 mb-1">المبلغ المطلوب (ريال)</label>
                    <input type="number" required placeholder="0.00" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-600 outline-none bg-slate-50 text-slate-800 font-medium">
                </div>
                <div>
                    <label id="txt-mod-loan-rsn" class="block text-sm font-bold text-slate-700 mb-1">ملاحظات أو أسباب</label>
                    <textarea rows="2" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-600 outline-none bg-slate-50 text-slate-800 font-medium"></textarea>
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-md mt-4 active:scale-95 transition-transform">
                    <span id="txt-mod-loan-btn">إرسال الطلب للإدارة</span>
                </button>
            </form>
        </div>
    </div>

    <!-- نافذة بلاغ مشكلة -->
    <div id="modal-issue" class="fixed bottom-0 left-0 right-0 z-50 hidden translate-y-full transition-transform duration-300 w-full max-w-md mx-auto">
        <div class="bg-white rounded-t-3xl shadow-2xl p-6 pb-10 border-t border-slate-100">
            <div class="flex justify-between items-center mb-6">
                <h3 id="txt-mod-issue-title" class="font-bold text-lg text-slate-800 flex items-center gap-2">
                    <i class="ph-fill ph-warning-octagon text-rose-600"></i> بلاغ عن مشكلة
                </h3>
                <button onclick="closeModals()" class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-200"><i class="ph-bold ph-x"></i></button>
            </div>
            <form onsubmit="handleFormSubmit(event, 'issue')" class="space-y-4">
                <div>
                    <label id="txt-mod-issue-type" class="block text-sm font-bold text-slate-700 mb-1">نوع المشكلة</label>
                    <select required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-rose-600 outline-none bg-slate-50 text-slate-800 font-medium">
                        <option id="opt-iss-1" value="safety">أمن وسلامة مهنية</option>
                        <option id="opt-iss-2" value="equip">عطل في معدة/آلة</option>
                        <option id="opt-iss-3" value="other">أخرى</option>
                    </select>
                </div>
                <div>
                    <label id="txt-mod-issue-desc" class="block text-sm font-bold text-slate-700 mb-1">وصف المشكلة</label>
                    <textarea required rows="3" placeholder="اشرح المشكلة باختصار..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-rose-600 outline-none bg-slate-50 text-slate-800 font-medium"></textarea>
                </div>
                <button type="submit" class="w-full bg-rose-600 text-white font-bold py-3.5 rounded-xl shadow-md mt-4 active:scale-95 transition-transform">
                    <span id="txt-mod-issue-btn">إرسال البلاغ عاجل</span>
                </button>
            </form>
        </div>
    </div>

    <!-- رسالة النجاح (Toast) -->
    <div id="toast-success" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-3 transition-all duration-300 -translate-y-20 opacity-0 z-[60] pointer-events-none w-max max-w-[90%]">
        <i class="ph-fill ph-check-circle text-emerald-400 text-xl"></i>
        <span id="txt-toast-msg" class="font-medium text-sm">تم إرسال الطلب بنجاح!</span>
    </div>

    <script>
        // --- 1. جلب البيانات من الإدارة (Shared LocalStorage) ---
        
        // دالة لجلب العمال المُسجلين من لوحة الإدارة
        const getWorkers = () => {
            const data = localStorage.getItem('app_workers');
            return data ? JSON.parse(data) : [];
        };

        // دالة لجلب المشاريع المُسجلة من لوحة الإدارة
        const getProjects = () => {
            const data = localStorage.getItem('app_projects');
            return data ? JSON.parse(data) : [];
        };

        // --- 2. القاموس اللغوي (Translations) ---
        const dict = {
            ar: {
                lang: "English",
                company: "شركة أركان الخليج",
                subtitle: "نظام الحضور الآمن",
                loginTitle: "تسجيل الدخول",
                workerId: "رقم العامل (كود الموظف)",
                loginBtn: "دخول للنظام",
                loginErr: "رقم العامل غير صحيح، أو غير مسجل بالإدارة!",
                deviceBlocked: "تم حظر الدخول! هذا الجهاز مسجل لعامل آخر.",
                gm: "صباح الخير",
                ge: "مساء الخير",
                selProj: "موقع العمل الحالي (اختر من القائمة):",
                selDef: "--- اختر موقع عملك ---",
                locErr: "عفواً! أنت خارج النطاق الجغرافي للمشروع.",
                gpsDenied: "يرجى تفعيل صلاحية الموقع (GPS) للمتابعة.",
                checkIn: "تسجيل الحضور",
                secCheck: "فحص أمني جاري...",
                workAt: "تعمل حالياً في:",
                timeLbl: "وقت الدخول:",
                checkOut: "إنهاء العمل (انصراف)",
                doneTitle: "تم إنهاء العمل بنجاح!",
                doneDesc: "تم إرسال بيانات الانصراف للإدارة. يمكنك إغلاق التطبيق الآن.",
                
                srvTitle: "الخدمات السريعة",
                srvLeave: "طلب إجازة", srvLoan: "طلب سلفة", srvIssue: "بلاغ مشكلة",
                
                modLeaveTitle: "تقديم طلب إجازة", modLeaveDate: "تاريخ البدء", modLeaveType: "نوع الإجازة", modLeaveBtn: "إرسال الطلب للإدارة",
                optLeave1: "إجازة سنوية (مستحقة)", optLeave2: "إجازة مرضية", optLeave3: "إجازة طارئة (بدون راتب)",
                
                modLoanTitle: "طلب سلفة مالية", modLoanAmt: "المبلغ المطلوب (ريال)", modLoanRsn: "ملاحظات أو أسباب", modLoanBtn: "إرسال الطلب للإدارة",
                
                modIssueTitle: "بلاغ عن مشكلة", modIssueType: "نوع المشكلة", modIssueDesc: "وصف المشكلة", modIssueBtn: "إرسال البلاغ عاجل",
                optIss1: "أمن وسلامة مهنية", optIss2: "عطل في معدة/آلة", optIss3: "أخرى",
                
                toastMsg: "تم إرسال طلبك بنجاح للإدارة!"
            },
            en: {
                lang: "عربي",
                company: "Arkan Al-Khaleej",
                subtitle: "Secure Attendance System",
                loginTitle: "Worker Login",
                workerId: "Worker ID Number",
                loginBtn: "System Login",
                loginErr: "Invalid Worker ID, or not registered by Admin!",
                deviceBlocked: "Access Denied! Device registered to another worker.",
                gm: "Good Morning",
                ge: "Good Evening",
                selProj: "Current Work Location:",
                selDef: "--- Select your location ---",
                locErr: "Error! You are out of project geofence.",
                gpsDenied: "Please enable GPS location to continue.",
                checkIn: "Check In",
                secCheck: "Security Check...",
                workAt: "Currently working at:",
                timeLbl: "Time In:",
                checkOut: "End Shift (Check Out)",
                doneTitle: "Shift Ended Successfully!",
                doneDesc: "Check-out data sent to admin. You may close the app.",
                
                srvTitle: "Quick Services",
                srvLeave: "Leave Req", srvLoan: "Loan Req", srvIssue: "Report Issue",
                
                modLeaveTitle: "Leave Request", modLeaveDate: "Start Date", modLeaveType: "Leave Type", modLeaveBtn: "Submit Request",
                optLeave1: "Annual Leave", optLeave2: "Sick Leave", optLeave3: "Unpaid Leave",
                
                modLoanTitle: "Loan Request", modLoanAmt: "Amount (SAR)", modLoanRsn: "Reason / Notes", modLoanBtn: "Submit Request",
                
                modIssueTitle: "Report Issue", modIssueType: "Issue Type", modIssueDesc: "Description", modIssueBtn: "Submit Urgent Report",
                optIss1: "Health & Safety", optIss2: "Equipment Failure", optIss3: "Other",
                
                toastMsg: "Your request was submitted successfully!"
            }
        };

        // --- 3. حالة التطبيق (State) ---
        let lang = 'ar';
        let currentUser = null;
        let attendanceStatus = 'none'; 
        
        // --- 4. الدوال الأساسية للمنطق (Logic) ---

        function toggleLang() {
            lang = lang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            if(lang === 'en') document.documentElement.classList.add('ltr');
            else document.documentElement.classList.remove('ltr');
            
            updateTexts();
        }

        function updateTexts() {
            const t = dict[lang];
            document.getElementById('txt-lang').innerText = t.lang;
            document.getElementById('txt-company').innerText = t.company;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('txt-login-title').innerText = t.loginTitle;
            document.getElementById('txt-worker-id').innerText = t.workerId;
            document.getElementById('txt-login-btn').innerText = t.loginBtn;
            document.getElementById('txt-login-error').innerText = t.loginErr;
            document.getElementById('input-worker-id').placeholder = lang === 'ar' ? 'أدخل رقمك هنا...' : 'Enter ID here...';
            
            document.getElementById('txt-select-proj').innerText = t.selProj;
            document.getElementById('txt-loc-error').innerText = t.locErr;
            document.getElementById('txt-btn-checkin').innerText = t.checkIn;
            document.getElementById('txt-sec-check').innerText = t.secCheck;
            document.getElementById('txt-working-at').innerText = t.workAt;
            document.getElementById('txt-time-label').innerText = t.timeLbl;
            document.getElementById('txt-btn-checkout').innerText = t.checkOut;
            document.getElementById('txt-shift-done').innerText = t.doneTitle;
            document.getElementById('txt-shift-desc').innerText = t.doneDesc;
            
            document.getElementById('txt-services-title').innerText = t.srvTitle;
            document.getElementById('txt-srv-leave').innerText = t.srvLeave;
            document.getElementById('txt-srv-loan').innerText = t.srvLoan;
            document.getElementById('txt-srv-issue').innerText = t.srvIssue;
            
            document.getElementById('txt-mod-leave-title').innerHTML = `<i class="ph-fill ph-calendar-plus text-blue-600"></i> ${t.modLeaveTitle}`;
            document.getElementById('txt-mod-leave-date').innerText = t.modLeaveDate;
            document.getElementById('txt-mod-leave-type').innerText = t.modLeaveType;
            document.getElementById('txt-mod-leave-btn').innerText = t.modLeaveBtn;
            document.getElementById('opt-leave-1').innerText = t.optLeave1;
            document.getElementById('opt-leave-2').innerText = t.optLeave2;
            document.getElementById('opt-leave-3').innerText = t.optLeave3;

            document.getElementById('txt-mod-loan-title').innerHTML = `<i class="ph-fill ph-money text-emerald-600"></i> ${t.modLoanTitle}`;
            document.getElementById('txt-mod-loan-amt').innerText = t.modLoanAmt;
            document.getElementById('txt-mod-loan-rsn').innerText = t.modLoanRsn;
            document.getElementById('txt-mod-loan-btn').innerText = t.modLoanBtn;

            document.getElementById('txt-mod-issue-title').innerHTML = `<i class="ph-fill ph-warning-octagon text-rose-600"></i> ${t.modIssueTitle}`;
            document.getElementById('txt-mod-issue-type').innerText = t.modIssueType;
            document.getElementById('txt-mod-issue-desc').innerText = t.modIssueDesc;
            document.getElementById('txt-mod-issue-btn').innerText = t.modIssueBtn;
            document.getElementById('opt-iss-1').innerText = t.optIss1;
            document.getElementById('opt-iss-2').innerText = t.optIss2;
            document.getElementById('opt-iss-3').innerText = t.optIss3;
            
            document.getElementById('txt-toast-msg').innerText = t.toastMsg;

            updateGreeting();
            renderProjects();
            
            if(attendanceStatus === 'working') {
                const pId = localStorage.getItem('arkan_proj_id');
                const p = getProjects().find(x => x.id === pId);
                if(p) document.getElementById('val-current-proj').innerText = p.name;
            }
        }

        function updateGreeting() {
            if(!currentUser) return;
            const hour = new Date().getHours();
            const t = dict[lang];
            document.getElementById('txt-greeting').innerText = hour < 12 ? t.gm : t.ge;
            document.getElementById('val-worker-name').innerText = currentUser.name;
        }

        function renderProjects() {
            const select = document.getElementById('select-project');
            select.innerHTML = `<option value="" disabled selected>${dict[lang].selDef}</option>`;
            const projects = getProjects();
            projects.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.innerText = p.name;
                select.appendChild(opt);
            });
        }

        function switchView(view) {
            document.getElementById('section-login').classList.add('hidden');
            document.getElementById('section-dashboard').classList.add('hidden');
            
            if(view === 'dashboard') {
                document.getElementById('section-dashboard').classList.remove('hidden');
                updateDashboardState();
            } else {
                document.getElementById('section-login').classList.remove('hidden');
                document.getElementById('input-worker-id').value = '';
                document.getElementById('login-error').classList.add('hidden');
            }
        }

        function updateDashboardState() {
            document.getElementById('state-checkin').classList.add('hidden');
            document.getElementById('state-loading').classList.add('hidden');
            document.getElementById('state-working').classList.add('hidden');
            document.getElementById('state-completed').classList.add('hidden');
            
            if(attendanceStatus === 'none') {
                document.getElementById('state-checkin').classList.remove('hidden');
                const projVal = document.getElementById('select-project').value;
                const btnCheckin = document.getElementById('btn-do-checkin');
                if(projVal) {
                    btnCheckin.classList.remove('opacity-50', 'cursor-not-allowed');
                    document.getElementById('btn-bypass').classList.remove('hidden');
                } else {
                    btnCheckin.classList.add('opacity-50', 'cursor-not-allowed');
                    document.getElementById('btn-bypass').classList.add('hidden');
                }
            } 
            else if(attendanceStatus === 'working') {
                document.getElementById('state-working').classList.remove('hidden');
                document.getElementById('val-checkin-time').innerText = localStorage.getItem('arkan_time');
                const pId = localStorage.getItem('arkan_proj_id');
                const p = getProjects().find(x => x.id === pId);
                if(p) document.getElementById('val-current-proj').innerText = p.name;
            } 
            else if(attendanceStatus === 'completed') {
                document.getElementById('state-completed').classList.remove('hidden');
            }
        }

        // --- 5. دوال الإجراءات (Actions) ---

        function login(e) {
            e.preventDefault();
            const id = document.getElementById('input-worker-id').value;
            const workersList = getWorkers();
            const worker = workersList.find(w => w.id === id);
            
            const errDiv = document.getElementById('login-error');
            const errTxt = document.getElementById('txt-login-error');
            
            if(worker) {
                const registeredOwner = localStorage.getItem('arkan_device_owner');
                
                if (registeredOwner && registeredOwner !== id) {
                    errTxt.innerText = dict[lang].deviceBlocked;
                    errDiv.classList.remove('hidden');
                    return;
                }
                
                if (!registeredOwner) {
                    localStorage.setItem('arkan_device_owner', id);
                    // تحديث حالة ارتباط الجهاز في الإدارة
                    worker.deviceLinked = true;
                    const wIndex = workersList.findIndex(w => w.id === id);
                    workersList[wIndex] = worker;
                    localStorage.setItem('app_workers', JSON.stringify(workersList));
                }

                currentUser = worker;
                localStorage.setItem('arkan_user_id', worker.id);
                errDiv.classList.add('hidden');
                
                const today = new Date().toDateString();
                const savedDay = localStorage.getItem('arkan_date');
                if(today !== savedDay) {
                    localStorage.setItem('arkan_date', today);
                    localStorage.removeItem('arkan_status');
                    attendanceStatus = 'none';
                } else {
                    attendanceStatus = localStorage.getItem('arkan_status') || 'none';
                }
                
                updateGreeting();
                switchView('dashboard');
            } else {
                errTxt.innerText = dict[lang].loginErr;
                errDiv.classList.remove('hidden');
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('arkan_user_id');
            switchView('login');
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const p1 = lat1 * Math.PI / 180;
            const p2 = lat2 * Math.PI / 180;
            const deltaP = (lat2 - lat1) * Math.PI / 180;
            const deltaLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(deltaP/2) * Math.sin(deltaP/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(deltaLon/2) * Math.sin(deltaLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function performRealSecurityCheck(isBypass = false) {
            const projVal = document.getElementById('select-project').value;
            if(!projVal) return;
            
            const project = getProjects().find(p => p.id === projVal);

            document.getElementById('location-error').classList.add('hidden');
            document.getElementById('state-checkin').classList.add('hidden');
            document.getElementById('state-loading').classList.remove('hidden');

            const finalizeCheckIn = () => {
                const now = new Date();
                const timeStr = now.toLocaleTimeString(lang === 'ar' ? 'ar-SA' : 'en-US', {hour:'2-digit', minute:'2-digit'});
                attendanceStatus = 'working';
                localStorage.setItem('arkan_status', 'working');
                localStorage.setItem('arkan_time', timeStr);
                localStorage.setItem('arkan_proj_id', projVal);
                
                // إرسال البيانات للإدارة (حفظ في Storage المشترك)
                const attendance = JSON.parse(localStorage.getItem('app_attendance') || '[]');
                attendance.push({
                    id: Date.now(),
                    workerId: currentUser.id,
                    workerName: currentUser.name,
                    projectId: project.id,
                    projectName: project.name,
                    timeIn: timeStr,
                    timeOut: null,
                    date: new Date().toISOString().split('T')[0],
                    status: 'working'
                });
                localStorage.setItem('app_attendance', JSON.stringify(attendance));

                updateDashboardState();
            };

            const showError = (msg) => {
                document.getElementById('txt-loc-error').innerText = msg;
                document.getElementById('location-error').classList.remove('hidden');
                document.getElementById('state-loading').classList.add('hidden');
                document.getElementById('state-checkin').classList.remove('hidden');
            };

            if (isBypass) {
                setTimeout(finalizeCheckIn, 1500);
                return;
            }

            if (!navigator.geolocation) {
                showError(dict[lang].gpsDenied);
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const { latitude, longitude } = position.coords;
                    const distance = calculateDistance(latitude, longitude, project.lat, project.lng);
                    
                    if (distance > project.radius) {
                        showError(`${dict[lang].locErr} (المسافة: ${Math.round(distance)}m > ${project.radius}m)`);
                    } else {
                        finalizeCheckIn();
                    }
                },
                (error) => {
                    showError(dict[lang].gpsDenied + ' (Error: ' + error.code + ')');
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function checkOut() {
            attendanceStatus = 'completed';
            localStorage.setItem('arkan_status', 'completed');
            
            // تحديث بيانات الانصراف في الإدارة
            const attendance = JSON.parse(localStorage.getItem('app_attendance') || '[]');
            const today = new Date().toISOString().split('T')[0];
            
            // البحث عن آخر تسجيل دخول لنفس العامل اليوم وهو ما زال "يعمل"
            let foundIndex = -1;
            for(let i = attendance.length - 1; i >= 0; i--) {
                if(attendance[i].workerId === currentUser.id && attendance[i].date === today && attendance[i].status === 'working') {
                    foundIndex = i;
                    break;
                }
            }

            if(foundIndex !== -1) {
                const timeOutStr = new Date().toLocaleTimeString(lang === 'ar' ? 'ar-SA' : 'en-US', {hour:'2-digit', minute:'2-digit'});
                attendance[foundIndex].timeOut = timeOutStr;
                attendance[foundIndex].status = 'completed';
                localStorage.setItem('app_attendance', JSON.stringify(attendance));
            }

            updateDashboardState();
        }

        // --- 6. النوافذ المنبثقة والطلبات (Requests) ---

        function openModal(id) {
            const overlay = document.getElementById('modal-overlay');
            const modal = document.getElementById(id);
            overlay.classList.remove('hidden');
            modal.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                modal.classList.remove('translate-y-full');
            }, 10);
        }

        function closeModals() {
            const overlay = document.getElementById('modal-overlay');
            const modals = ['modal-leave', 'modal-loan', 'modal-issue'];
            overlay.classList.add('opacity-0');
            modals.forEach(id => {
                document.getElementById(id).classList.add('translate-y-full');
            });
            setTimeout(() => {
                overlay.classList.add('hidden');
                modals.forEach(id => document.getElementById(id).classList.add('hidden'));
            }, 300);
        }

        // معالجة إرسال النماذج للإدارة
        function handleFormSubmit(e, reqType) {
            e.preventDefault(); 
            
            let typeName = "";
            let details = "";
            
            if(reqType === 'leave') {
                typeName = "طلب إجازة";
                const date = e.target.querySelector('input[type="date"]').value;
                const select = e.target.querySelector('select');
                const leaveType = select.options[select.selectedIndex].text;
                details = `تاريخ البدء: ${date} | النوع: ${leaveType}`;
            } 
            else if (reqType === 'loan') {
                typeName = "طلب سلفة";
                const amt = e.target.querySelector('input[type="number"]').value;
                const reason = e.target.querySelector('textarea').value;
                details = `المبلغ: ${amt} ريال | السبب: ${reason || 'لا يوجد'}`;
            } 
            else if (reqType === 'issue') {
                typeName = "بلاغ مشكلة";
                const select = e.target.querySelector('select');
                const issueType = select.options[select.selectedIndex].text;
                const desc = e.target.querySelector('textarea').value;
                details = `التصنيف: ${issueType} | التفاصيل: ${desc}`;
            }

            // إرسال الطلب وحفظه في الإدارة
            const requests = JSON.parse(localStorage.getItem('app_requests') || '[]');
            requests.push({
                id: Date.now(),
                workerName: currentUser.name,
                type: reqType,
                typeName: typeName,
                details: details,
                date: new Date().toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'}) + ' - ' + new Date().toLocaleDateString('ar-SA'),
                status: 'pending'
            });
            localStorage.setItem('app_requests', JSON.stringify(requests));

            closeModals();
            e.target.reset(); 
            
            setTimeout(() => {
                const toast = document.getElementById('toast-success');
                toast.classList.remove('-translate-y-20', 'opacity-0');
                setTimeout(() => { toast.classList.add('-translate-y-20', 'opacity-0'); }, 3000);
            }, 400);
        }

        // --- 7. ربط الأحداث وتشغيل التطبيق ---

        document.getElementById('btn-lang').addEventListener('click', toggleLang);
        document.getElementById('form-login').addEventListener('submit', login);
        document.getElementById('btn-logout').addEventListener('click', logout);
        
        document.getElementById('select-project').addEventListener('change', () => { updateDashboardState(); });

        document.getElementById('btn-do-checkin').addEventListener('click', () => {
            if(document.getElementById('select-project').value) performRealSecurityCheck(false);
        });
        
        document.getElementById('btn-bypass').addEventListener('click', () => {
            if(document.getElementById('select-project').value) performRealSecurityCheck(true);
        });

        document.getElementById('btn-do-checkout').addEventListener('click', checkOut);
        document.getElementById('modal-overlay').addEventListener('click', closeModals);

        window.onload = () => {
            updateTexts();
            
            const savedId = localStorage.getItem('arkan_user_id');
            if(savedId) {
                const workersList = getWorkers();
                const worker = workersList.find(w => w.id === savedId);
                if(worker) {
                    currentUser = worker;
                    
                    const today = new Date().toDateString();
                    if(localStorage.getItem('arkan_date') === today) {
                        attendanceStatus = localStorage.getItem('arkan_status') || 'none';
                    } else {
                        localStorage.setItem('arkan_date', today);
                        localStorage.removeItem('arkan_status');
                        attendanceStatus = 'none';
                    }
                    
                    updateGreeting();
                    switchView('dashboard');
                    return;
                }
            }
            switchView('login');
        };
    </script>
</body>
</html>
